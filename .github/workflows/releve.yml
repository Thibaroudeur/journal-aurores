# Un relevé de l'activité aurorale au-dessus de l'Islande toutes les 30 minutes,
# committé dans donnees/AAAA-MM-JJ.ndjson. Mode d'emploi : README.md.
#
# Ce fichier est le modèle gardé dans le dépôt du site
# (scripts/journal-aurores/releve.yml). Il ne tourne que dans le dépôt public
# Thibaroudeur/journal-aurores, copié en .github/workflows/releve.yml : GitHub
# ne lance les tâches planifiées que depuis la branche par défaut, et les
# minutes d'Actions ne sont gratuites sans limite que dans un dépôt public.

name: Relevé

#
# DÉSACTIVÉ depuis le 17 octobre 2026 : la première nuit, le planning de GitHub
# n'a lancé que 4 relevés sur 27. Le journal tourne désormais dans Supabase
# (pg_cron et l'Edge Function journal-aurores, voir README.md). Ce modèle reste
# pour l'historique des 8 premiers relevés.

on:
  schedule:
    # h07 et h37 plutôt que h00 et h30 : GitHub prévient que les tâches
    # planifiées prennent du retard en début d'heure, quand la charge monte.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Deux relevés ne se poussent jamais en même temps.
concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Relevé
        run: node releve.mjs donnees

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees
          git commit --quiet -m "releve: $(date -u +%Y-%m-%dT%H:%MZ)"
          for essai in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 10
          done
          exit 1
